<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Haunted House Date?</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #000000, #4b0082);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #1a1a1aee;
      border-radius: 18px;
      padding: 30px 40px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(255, 140, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    /* Cobweb top-left */
    .card::before {
      content: "🕸️";
      position: absolute;
      font-size: 90px;
      opacity: 0.12;
      top: -20px;
      left: -10px;
      transform: rotate(-15deg);
    }

    /* Cobweb bottom-right */
    .card::after {
      content: "🕸️";
      position: absolute;
      font-size: 70px;
      opacity: 0.12;
      bottom: -10px;
      right: -5px;
      transform: rotate(20deg);
    }

    /* Spider hanging slightly left of the right edge */
    .spider-container {
      position: absolute;
      top: -40px;
      right: -10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      animation: drop 4s ease-in-out infinite;
    }

    /* Web line now animates its height */
    .web-line {
      width: 2px;
      background: #cccccc;
      opacity: 0.4;
      animation: webGrow 4s ease-in-out infinite;
    }

    .spider {
      font-size: 40px;
      opacity: 0.9;
      margin-top: -5px;
    }

    /* Spider movement */
    @keyframes drop {
      0% {
        transform: translateY(-40px);
      }
      40% {
        transform: translateY(50px);
      }
      60% {
        transform: translateY(50px);
      }
      100% {
        transform: translateY(-40px);
      }
    }

    /* Web grows/shrinks to match spider movement */
    @keyframes webGrow {
      0% {
        height: 40px;
      }
      40% {
        height: 200px; /* long enough to stay connected */
      }
      60% {
        height: 200px;
      }
      100% {
        height: 40px;
      }
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      color: #ff7518;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 1.2rem;
      color: #e0e0e0;
    }

    p {
      margin: 0 0 25px;
      color: #cccccc;
      line-height: 1.5;
    }

    .date {
      font-weight: 600;
      color: #ff7518;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .yes {
      background: #ff7518;
      color: #fff;
      box-shadow: 0 6px 16px rgba(255, 117, 24, 0.4);
    }

    .yes:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(255, 117, 24, 0.5);
    }

    .maybe {
      background: #4b0082;
      color: #e0e0ff;
    }

    .maybe:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(75, 0, 130, 0.4);
    }

    .no {
      background: #111;
      color: #ff0000;
    }

    .no:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(255, 0, 0, 0.25);
    }

    .broken-heart {
      font-size: 3rem;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.6s ease, transform 0.6s ease;
      margin-top: 20px;
      color: #ff0000;
    }

    .broken-heart.show {
      opacity: 1;
      transform: scale(1);
    }

    .broken-heart.fade-out {
      opacity: 0;
      transform: scale(0.5);
    }

    .broken-heart::before {
      content: "💔";
    }

    .fade {
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #answerText {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #f0f0f0;
      min-height: 1.2em;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #bbbbbb;
    }
  </style>
</head>

<body>
  <div class="card">

    <!-- Spider + Web -->
    <div class="spider-container">
      <div class="web-line"></div>
      <div class="spider">🕷️</div>
    </div>

    <h1>Esme</h1>
    <h2>I’ve got a question for you...</h2>

    <p>
      Would you like to go to a haunted house with me,<br />
      and get drinks and hang out afterwards?<br /><br />
      <span class="date">This Friday night</span> (Or any other night idk when you work)
    </p>

    <div class="buttons">
      <button class="yes" onclick="sendYes()">Yes! 🎃</button>
      <button class="maybe" onclick="sendMaybe()">Maybe 👻</button>
      <button class="no" onclick="sendNo()">No 😢</button>
    </div>

    <div id="answerText"></div>

    <div id="brokenHeart" class="broken-heart"></div>

    <div class="footer-note">
      (Totally okay if you’re busy, just thought it’d be fun)
    </div>
  </div>

  <script>
    function sendYes() {
      const box = document.getElementById("answerText");
      box.className = "fade";
      box.innerHTML = "See you then 😉";

      confetti({
        particleCount: 200,
        spread: 100,
        startVelocity: 40,
        origin: { y: 0.6 },
        colors: ["#ff7518", "#4b0082", "#00ff00", "#000000"]
      });
    }

    function sendMaybe() {
      const box = document.getElementById("answerText");
      box.className = "fade";
      box.innerHTML = "No pressure at all, just let me know 💌";
    }

    function sendNo() {
      const box = document.getElementById("answerText");
      box.className = "fade";
      box.innerHTML = "No worries, maybe another time";

      const heart = document.getElementById("brokenHeart");

      heart.classList.remove("fade-out");
      heart.classList.add("show");

      setTimeout(() => {
        heart.classList.add("fade-out");
      }, 1500);
    }
  </script>
</body>
</html>
